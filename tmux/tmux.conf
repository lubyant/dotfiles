# ~/.tmux.conf  —  cross-platform (Linux + macOS)
# Symlinked from ~/dotfiles/tmux/tmux.conf

# ---- General ---------------------------------------------------------------
set  -g  mode-keys vi
set  -g  history-limit 50000
set  -sg escape-time 10          # snappier <Esc> in nvim
set  -g  focus-events on
set  -g  mouse on
set  -g  base-index 1            # windows start at 1
setw -g  pane-base-index 1       # panes start at 1
set  -g  renumber-windows on
set  -g  set-clipboard on
set  -g  display-time 2000

# ---- Terminal / colors --------------------------------------------------------
set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc,alacritty:Tc"

# ---- Reload -----------------------------------------------------------------
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ---- Splits: intuitive binds, keep current path ---------------------------
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"

# ---- Pane navigation (vi style) ------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- Copy mode (vi) ---------------------------------------------------------
bind Enter copy-mode
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi C-v   send -X rectangle-toggle

# ---- OS-aware clipboard integration --------------------------------------
# macOS -> pbcopy ; Wayland -> wl-copy ; X11 -> xclip
if-shell 'uname | grep -q Darwin' {
    bind -T copy-mode-vi y                 send -X copy-pipe-and-cancel "pbcopy"
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
} {
    if-shell 'command -v wl-copy >/dev/null 2>&1' {
        bind -T copy-mode-vi y                 send -X copy-pipe-and-cancel "wl-copy"
        bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
    } {
        bind -T copy-mode-vi y                 send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
        bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
    }
}

# ---- Status bar -----------------------------------------------------------
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=white"
set -g status-left  "#[bold] #S #[nobold]"
set -g status-left-length 30
set -g status-right "#[fg=cyan]#H #[fg=yellow]%Y-%m-%d %H:%M "
set -g window-status-current-style "bold,fg=green"
